name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 23f3004181@ds.study.iitm.ac.in"
        run: echo "Identity step"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run app in background
        run: |
          python app.py &
          sleep 2

      - name: Test release-gate endpoint
        run: |
          curl -sf -X POST http://localhost:8000/release-gate \
            -H "Content-Type: application/json" \
            -d '{"target":"preview","event":"push","ref":"refs/heads/dev","workflow":{"trigger":"push","permissions":{"contents":"read","packages":"write","id-token":"none"},"testsPassed":true,"matrixComplete":true,"failFast":false,"actions":[{"owner":"actions","name":"checkout","ref":"v4"}]},"image":{"multiStage":true,"runsAsRoot":false,"secretMode":"none","criticalVulnerabilities":0,"digestPinned":true}}' \
            | tee response.json
          grep -q '"decision":"promote"' response.json
